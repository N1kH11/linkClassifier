services:
  - type: web
    name: link-classifier-backend
    env: python
    rootDirectory: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn link_classifier.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
